[project]
name = "vguitar"
version = "0.1.0"
description = "Real-time digital emulation of nonlinear analog guitar circuits, trained on SPICE simulations. Benchmarks Volterra, block-oriented, and neural approaches."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soxr>=0.5",          # high-quality, fast resampling (sim rate -> audio rate)
    "soundfile>=0.12",    # wav I/O
    "sounddevice>=0.5",   # real-time audio I/O (PortAudio)
    "matplotlib>=3.8",    # spectrograms / diagnostic plots
    "rich>=13.7",         # readable tables
    "tqdm>=4.66",         # progress bars
    "pyspice>=1.5",       # ngspice driver (ground-truth validator)
]

[project.optional-dependencies]
# the frozen neural/system-ID era under src/vguitar/models/archive/ (CIRCE3, TCN,
# RNN, SSM, WH) -- install with `uv sync --extra neural` to re-run archived work
neural = ["torch>=2.4"]

[project.scripts]
vguitar = "vguitar.cli:main"

# ---------------------------------------------------------------------------
# torch: pull the CUDA (cu126) wheel on Windows so neural training can use the
# GPU (e.g. an RTX 4090). Inference / streaming / RTF still run on CPU (the
# real-time deployment target). Other platforms fall back to the default index.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "platform_system == 'Windows'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vguitar"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
# Pragmatic, high-signal rule set. Keep it strict but not noisy.
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults (common & fine for configs)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]
# archived one-shot studies are frozen records, not style targets
"experiments/archive/**" = ["E401", "E702", "NPY002", "RUF059"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/archive = the frozen neural era; run on demand with the `neural` extra:
#   uv sync --extra neural; uv run pytest tests/archive
addopts = "-q --ignore=tests/archive"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]
