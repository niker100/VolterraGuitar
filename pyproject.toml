[project]
name = "vguitar"
version = "0.1.0"
description = "Real-time digital emulation of nonlinear analog guitar circuits, trained on SPICE simulations. Benchmarks Volterra, block-oriented, and neural approaches."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soxr>=0.5",          # high-quality, fast resampling (sim rate -> audio rate)
    "soundfile>=0.12",    # wav I/O
    "sounddevice>=0.5",   # real-time audio I/O (PortAudio)
    "torch>=2.4",         # neural models (CPU build is what we want for low-latency RT)
    "matplotlib>=3.8",    # spectrograms / kernel plots
    "rich>=13.7",         # readable benchmark tables
    "tqdm>=4.66",         # progress bars
    "pyspice>=1.5",       # ngspice driver (circuit sim from Python)
]

[project.scripts]
vguitar = "vguitar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vguitar"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
# Pragmatic, high-signal rule set. Keep it strict but not noisy.
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults (common & fine for configs)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]
